
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VOXEL WORLD 3.0</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial;touch-action:none;user-select:none}
canvas{display:block}
#title{position:fixed;top:15px;width:100%;text-align:center;color:white;font-size:23px;font-weight:bold;text-shadow:2px 2px 5px #222;pointer-events:none;z-index:5}
#hint{position:fixed;top:48px;width:100%;text-align:center;color:white;font-size:11px;text-shadow:1px 1px 3px #222;pointer-events:none;z-index:5}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:26px;pointer-events:none;z-index:4}
#joystick{position:fixed;left:18px;bottom:100px;width:120px;height:120px;border-radius:50%;background:#2225;border:2px solid #fff9;z-index:10;touch-action:none}
#stick{position:absolute;left:32px;top:32px;width:52px;height:52px;border-radius:50%;background:#fffb;border:2px solid #555}
#actions{position:fixed;right:14px;bottom:100px;display:grid;grid-template-columns:70px 70px;gap:8px;z-index:10}
.action{height:55px;border:2px solid #fff;border-radius:13px;background:#263746cc;color:white;font-weight:bold;font-size:12px;touch-action:none}
#jump{grid-column:1/3;background:#2875bd;height:45px}
#hotbar{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;display:flex;gap:4px;padding:6px;background:#222c;border:2px solid #fff9;border-radius:12px;z-index:12}
.slot{width:43px;height:48px;border:2px solid #aaa;border-radius:7px;background:#ffffff20;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px}
.slot small{font-size:8px}
.slot.selected{border:3px solid #ffe45c;transform:translateY(-4px)}
#status{position:fixed;left:50%;transform:translateX(-50%);bottom:72px;padding:5px 10px;background:#17232c99;color:white;font-size:11px;border-radius:8px;z-index:8;white-space:nowrap}
</style>
</head>
<body>
<div id="title">VOXEL WORLD 3.0</div>
<div id="hint">Glisse à droite pour regarder • Joystick à gauche</div>
<div id="crosshair">+</div>
<div id="joystick"><div id="stick"></div></div>
<div id="actions">
<button class="action" id="breakBtn">CASSER</button>
<button class="action" id="placeBtn">POSER</button>
<button class="action" id="jump">SAUTER</button>
</div>
<div id="status">Bloc sélectionné : Herbe</div>
<div id="hotbar"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,24,65);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x71805b,2));
const sun=new THREE.DirectionalLight(0xffffff,1.35);
sun.position.set(15,25,10);
scene.add(sun);

function texture(base,spots){
 const c=document.createElement('canvas');
 c.width=c.height=64;
 const ctx=c.getContext('2d');
 ctx.fillStyle=base;
 ctx.fillRect(0,0,64,64);
 for(let i=0;i<180;i++){
  ctx.fillStyle=spots[Math.floor(Math.random()*spots.length)];
  ctx.globalAlpha=.25+Math.random()*.55;
  const s=2+Math.random()*5;
  ctx.fillRect(Math.random()*64,Math.random()*64,s,s);
 }
 ctx.globalAlpha=1;
 const t=new THREE.CanvasTexture(c);
 t.colorSpace=THREE.SRGBColorSpace;
 t.magFilter=THREE.NearestFilter;
 return t;
}

const grassTop=texture('#65b83c',['#8bd34c','#4d9e2c','#a0d85a']);
const grassSide=texture('#79502d',['#65b83c','#8bd34c','#6b4326']);
const dirtTex=texture('#79502d',['#96643b','#603c25','#a27449']);
const stoneTex=texture('#858585',['#a5a5a5','#696969','#b5b5b5']);
const woodSide=texture('#815027',['#a66d36','#603b20','#bd8548']);
const woodTop=texture('#b17b42',['#80552d','#d09b5b']);
const leavesTex=texture('#278a35',['#48aa3e','#176d2b','#70bd42']);
const sandTex=texture('#d9c27a',['#f0dc9a','#bda45e']);

function mat(map){return new THREE.MeshLambertMaterial({map});}

const materials={
 grass:[
  mat(grassSide),mat(grassSide),mat(grassTop),
  mat(dirtTex),mat(grassSide),mat(grassSide)
 ],
 dirt:mat(dirtTex),
 stone:mat(stoneTex),
 wood:[
  mat(woodSide),mat(woodSide),mat(woodTop),
  mat(woodTop),mat(woodSide),mat(woodSide)
 ],
 leaves:new THREE.MeshLambertMaterial({map:leavesTex}),
 sand:mat(sandTex)
};

const geometry=new THREE.BoxGeometry(1,1,1);
const blocks=new Map();
const heights=new Map();
const key=(x,y,z)=>`${x},${y},${z}`;

function addBlock(x,y,z,type){
 const k=key(x,y,z);
 if(blocks.has(k))return;
 const mesh=new THREE.Mesh(geometry,materials[type]||materials.grass);
 mesh.position.set(x,y,z);
 mesh.userData={x,y,z,type};
 scene.add(mesh);
 blocks.set(k,mesh);
}

function heightAt(x,z){
 return Math.floor(
  2+Math.sin(x*.27)*1.25+
  Math.cos(z*.25)*1.15+
  Math.sin((x+z)*.16)*.65
 );
}

for(let x=-16;x<=16;x++){
 for(let z=-16;z<=16;z++){
  const h=heightAt(x,z);
  heights.set(`${x},${z}`,h);
  for(let y=-3;y<=h;y++){
   let type='stone';
   if(y===h)type='grass';
   else if(y>=h-2)type='dirt';
   addBlock(x,y,z,type);
  }
 }
}

// ARBRES
for(let x=-13;x<=13;x+=5){
 for(let z=-13;z<=13;z+=5){
  if(Math.abs(x)<3&&Math.abs(z-7)<4)continue;
  const h=heightAt(x,z);

  // Tronc
  for(let y=1;y<=3;y++){
   addBlock(x,h+y,z,'wood');
  }

  // Feuilles
  for(let dx=-2;dx<=2;dx++){
   for(let dz=-2;dz<=2;dz++){
    for(let dy=2;dy<=4;dy++){
     if(Math.abs(dx)+Math.abs(dz)+(dy===4?1:0)<=4){
      addBlock(x+dx,h+dy,z+dz,'leaves');
     }
    }
   }
  }
 }
}

const player={
 x:0,z:7,y:heightAt(0,7)+1.65,
 yaw:0,pitch:0,vy:0,onGround:false
};

camera.position.set(player.x,player.y,player.z);
const raycaster=new THREE.Raycaster();
raycaster.far=6;

function targetedBlock(){
 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
 const hits=raycaster.intersectObjects([...blocks.values()],false);
 return hits[0]||null;
}

const blockTypes=[
 {type:'grass',icon:'🟩',name:'Herbe'},
 {type:'dirt',icon:'🟫',name:'Terre'},
 {type:'stone',icon:'🪨',name:'Pierre'},
 {type:'wood',icon:'🪵',name:'Bois'},
 {type:'leaves',icon:'🍃',name:'Feuilles'},
 {type:'sand',icon:'🟨',name:'Sable'}
];

let selected='grass';
const hotbar=document.getElementById('hotbar');

function buildHotbar(){
 hotbar.innerHTML='';
 for(const b of blockTypes){
  const el=document.createElement('button');
  el.className='slot'+(selected===b.type?' selected':'');
  el.innerHTML=`<span>${b.icon}</span><small>${b.name}</small>`;
  el.addEventListener('pointerdown',e=>{
   e.preventDefault();
   selected=b.type;
   buildHotbar();
   document.getElementById('status').textContent='Bloc sélectionné : '+b.name;
  });
  hotbar.appendChild(el);
 }
}
buildHotbar();

function removeBlock(mesh){
 const p=mesh.userData;
 blocks.delete(key(p.x,p.y,p.z));
 scene.remove(mesh);
}

document.getElementById('breakBtn').addEventListener('pointerdown',e=>{
 e.preventDefault();
 const hit=targetedBlock();
 if(hit)removeBlock(hit.object);
});

document.getElementById('placeBtn').addEventListener('pointerdown',e=>{
 e.preventDefault();
 const hit=targetedBlock();
 if(!hit)return;
 const p=hit.object.userData;
 const n=hit.face.normal;
 const x=p.x+Math.round(n.x);
 const y=p.y+Math.round(n.y);
 const z=p.z+Math.round(n.z);
 if(Math.abs(x-player.x)<.8&&Math.abs(z-player.z)<.8&&y>=player.y-1.7&&y<=player.y+.2)return;
 addBlock(x,y,z,selected);
});

function jump(){
 if(player.onGround){
  player.vy=7.2;
  player.onGround=false;
 }
}
document.getElementById('jump').addEventListener('pointerdown',e=>{
 e.preventDefault();
 jump();
});

// JOYSTICK
const joy=document.getElementById('joystick');
const stick=document.getElementById('stick');
let joyId=null,joyX=0,joyY=0;

function resetJoy(){
 joyId=null;
 joyX=0;
 joyY=0;
 stick.style.transform='translate(0px,0px)';
}

function moveJoy(e){
 const r=joy.getBoundingClientRect();
 const cx=r.left+r.width/2;
 const cy=r.top+r.height/2;
 let dx=e.clientX-cx;
 let dy=e.clientY-cy;
 const len=Math.hypot(dx,dy);
 const max=37;
 if(len>max){dx=dx/len*max;dy=dy/len*max;}
 joyX=dx/max;
 joyY=dy/max;
 stick.style.transform=`translate(${dx}px,${dy}px)`;
}

joy.addEventListener('pointerdown',e=>{
 e.preventDefault();
 joyId=e.pointerId;
 joy.setPointerCapture(joyId);
 moveJoy(e);
});
joy.addEventListener('pointermove',e=>{
 if(e.pointerId===joyId)moveJoy(e);
});
joy.addEventListener('pointerup',e=>{
 if(e.pointerId===joyId)resetJoy();
});
joy.addEventListener('pointercancel',resetJoy);

// CAMÉRA TACTILE
let lookId=null,lastX=0,lastY=0;

renderer.domElement.addEventListener('pointerdown',e=>{
 lookId=e.pointerId;
 lastX=e.clientX;
 lastY=e.clientY;
 renderer.domElement.setPointerCapture(lookId);
});

renderer.domElement.addEventListener('pointermove',e=>{
 if(e.pointerId!==lookId)return;
 const dx=e.clientX-lastX;
 const dy=e.clientY-lastY;
 player.yaw-=dx*.005;
 player.pitch-=dy*.004;
 player.pitch=Math.max(-1.25,Math.min(1.25,player.pitch));
 lastX=e.clientX;
 lastY=e.clientY;
});

function stopLook(e){
 if(e.pointerId===lookId)lookId=null;
}
renderer.domElement.addEventListener('pointerup',stopLook);
renderer.domElement.addEventListener('pointercancel',stopLook);

// DÉPLACEMENT ET GRAVITÉ
const clock=new THREE.Clock();

function groundHeight(x,z){
 const ix=Math.round(x);
 const iz=Math.round(z);
 let h=heights.get(`${ix},${iz}`);
 if(h===undefined)h=heightAt(ix,iz);
 return h+1.65;
}
function canMoveTo(x,z){
 const radius=0.38;
 const feet=player.y-1.65;
 const head=player.y+0.15;

 for(const block of blocks.values()){
  const p=block.position;

  if(Math.abs(x-p.x)<0.5+radius &&
     Math.abs(z-p.z)<0.5+radius){

   const bottom=p.y-0.5;
   const top=p.y+0.5;

   if(head>bottom && feet<top){
    return false;
   }
  }
 }
 return true;
}
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 const forward=-joyY;
 const side=joyX;
 const speed=5.2;

 const dx=(-Math.sin(player.yaw)*forward+
 Math.cos(player.yaw)*side)*speed*dt;

 const dz=(-Math.cos(player.yaw)*forward-
 Math.sin(player.yaw)*side)*speed*dt;

 const nextX=THREE.MathUtils.clamp(player.x+dx,-15,15);
const nextZ=THREE.MathUtils.clamp(player.z+dz,-15,15);

if(canMoveTo(nextX,player.z)){
 player.x=nextX;
}

if(canMoveTo(player.x,nextZ)){
 player.z=nextZ;
}
 player.vy-=18*dt;
 player.y+=player.vy*dt;

 const floor=groundHeight(player.x,player.z);
 if(player.y<=floor){
  player.y=floor;
  player.vy=0;
  player.onGround=true;
 }

 camera.position.set(player.x,player.y,player.z);
 camera.rotation.order='YXZ';
 camera.rotation.y=player.yaw;
 camera.rotation.x=player.pitch;

 renderer.render(scene,camera);
}

animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
